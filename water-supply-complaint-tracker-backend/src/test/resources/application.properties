# Tests use an in-memory H2 database (in MySQL compatibility mode),
# so "mvn test" works without a running MySQL server.
spring.datasource.url=jdbc:h2:mem:wst;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
app.seed-sample-data=true
