spring.application.name=water-supply-complaint-tracker

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------
# MySQL connection
# Each value can be overridden with an environment variable,
# e.g. DB_PASSWORD=secret mvn spring-boot:run
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/water_supply_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:wst_user}
spring.datasource.password=${DB_PASSWORD:Wst#Dev2026}

# ---------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update -> Hibernate creates/updates tables from the
# @Entity classes on startup. Good for development; use
# "validate" with a managed schema in production.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Store all timestamps in UTC so the frontend gets consistent ISO times
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------
# JSON
# ---------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------
# Browser origins allowed to call the API (comma separated).
# Patterns allow any Vite port (5173, 5174, ...).
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
# Load sample teams and complaints when the database is empty
app.seed-sample-data=true
